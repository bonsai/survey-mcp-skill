<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>survey-mcp-skill システム構成図</title>
<style>
  body { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 2rem; background:#fafafa; }
  h1 { font-size: 1.5rem; margin-bottom: 1rem; }
  .diagram { background:#fff; border:1px solid #ddd; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.05); padding:1rem; }
  svg text { font-family: inherit; user-select: none; }
  .box { cursor: pointer; transition: opacity 0.2s; }
  .box:hover { opacity: 0.85; }
  .group-label { font-size: 12px; fill: #666; font-weight: bold; text-transform: uppercase; }
  .arrow { stroke: #666; stroke-width: 1.5; fill: none; }
  .arrow-dotted { stroke: #999; stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; }
</style>
</head>
<body>
<h1>survey-mcp-skill システム構成図</h1>
<div class="diagram">
<svg viewBox="0 0 1200 900" width="100%" height="auto">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowhead-dotted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- Layer backgrounds -->
  <rect x="20" y="20" width="1160" height="80" rx="8" fill="#e0f7fa" opacity="0.4"/>
  <text x="40" y="45" class="group-label" style="fill:#00838f">Layer 1: Interface</text>

  <rect x="20" y="120" width="1160" height="80" rx="8" fill="#fff3e0" opacity="0.4"/>
  <text x="40" y="145" class="group-label" style="fill:#ef6c00">Layer 2: Transport</text>

  <rect x="20" y="220" width="900" height="300" rx="8" fill="#e8f5e9" opacity="0.3"/>
  <text x="40" y="245" class="group-label" style="fill:#2e7d32">Layer 3: Server / API</text>

  <rect x="20" y="540" width="900" height="140" rx="8" fill="#fce4ec" opacity="0.3"/>
  <text x="40" y="565" class="group-label" style="fill:#c62828">Layer 4: Domain / Sources</text>

  <rect x="20" y="700" width="900" height="160" rx="8" fill="#fffde7" opacity="0.4"/>
  <text x="40" y="725" class="group-label" style="fill:#f9a825">Layer 5: Outputs</text>

  <!-- User / Pi -->
  <g class="box">
    <rect x="500" y="40" width="200" height="50" rx="8" fill="#4dd0e1" stroke="#00838f" stroke-width="2"/>
    <text x="600" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">User / Pi TUI</text>
    <text x="600" y="82" text-anchor="middle" font-size="11" fill="#e0f7fa">自然言語で話しかける</text>
  </g>

  <!-- MCP stdio -->
  <g class="box">
    <rect x="480" y="140" width="240" height="50" rx="8" fill="#ffb74d" stroke="#ef6c00" stroke-width="2"/>
    <text x="600" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">MCP stdio transport</text>
    <text x="600" y="182" text-anchor="middle" font-size="11" fill="#fff3e0">JSON-RPC over stdout/stderr</text>
  </g>

  <!-- FastAPI / FastMCP -->
  <g class="box">
    <rect x="250" y="260" width="440" height="60" rx="8" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
    <text x="470" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">FastAPI + FastMCP + OpenAPI</text>
    <text x="470" y="310" text-anchor="middle" font-size="11" fill="#e8f5e9">REST endpoints ↔ MCP tools 自動生成</text>
  </g>

  <!-- Tools -->
  <g class="box">
    <rect x="220" y="360" width="140" height="50" rx="6" fill="#81c784" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="290" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">run_survey</text>
  </g>
  <g class="box">
    <rect x="400" y="360" width="140" height="50" rx="6" fill="#81c784" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="470" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">list_surveys</text>
  </g>
  <g class="box">
    <rect x="580" y="360" width="140" height="50" rx="6" fill="#81c784" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="650" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">get_survey</text>
  </g>

  <!-- Pipeline Orchestrator -->
  <g class="box">
    <rect x="300" y="460" width="340" height="50" rx="8" fill="#42a5f5" stroke="#1565c0" stroke-width="2"/>
    <text x="470" y="490" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Pipeline Orchestrator</text>
  </g>

  <!-- Domain boxes -->
  <g class="box">
    <rect x="140" y="580" width="180" height="70" rx="8" fill="#f06292" stroke="#c62828" stroke-width="2"/>
    <text x="230" y="610" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Paper</text>
    <text x="230" y="630" text-anchor="middle" font-size="11" fill="#fce4ec">Semantic Scholar / arXiv</text>
  </g>
  <g class="box">
    <rect x="380" y="580" width="180" height="70" rx="8" fill="#f06292" stroke="#c62828" stroke-width="2" opacity="0.5"/>
    <text x="470" y="610" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Repo</text>
    <text x="470" y="630" text-anchor="middle" font-size="11" fill="#fce4ec">(future: GitHub, PyPI)</text>
  </g>
  <g class="box">
    <rect x="620" y="580" width="180" height="70" rx="8" fill="#f06292" stroke="#c62828" stroke-width="2" opacity="0.5"/>
    <text x="710" y="610" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Marketing</text>
    <text x="710" y="630" text-anchor="middle" font-size="11" fill="#fce4ec">(future: SNS, trend)</text>
  </g>

  <!-- Data sources detail -->
  <g class="box">
    <rect x="100" y="690" width="160" height="50" rx="6" fill="#ce93d8" stroke="#7b1fa2" stroke-width="1.5"/>
    <text x="180" y="720" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Semantic Scholar</text>
  </g>
  <g class="box">
    <rect x="250" y="760" width="140" height="50" rx="6" fill="#ce93d8" stroke="#7b1fa2" stroke-width="1.5"/>
    <text x="320" y="790" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">arXiv (fallback)</text>
  </g>

  <!-- Outputs -->
  <g class="box">
    <rect x="480" y="740" width="140" height="50" rx="6" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5"/>
    <text x="550" y="770" text-anchor="middle" font-size="12" font-weight="bold" fill="#5d4037">SQLite DB</text>
  </g>
  <g class="box">
    <rect x="640" y="740" width="160" height="50" rx="6" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5"/>
    <text x="720" y="770" text-anchor="middle" font-size="12" font-weight="bold" fill="#5d4037">MD / JSON / HTML</text>
  </g>
  <g class="box">
    <rect x="640" y="810" width="160" height="50" rx="6" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5"/>
    <text x="720" y="840" text-anchor="middle" font-size="12" font-weight="bold" fill="#5d4037">llm-wiki Recap</text>
  </g>

  <!-- Influences (right column) -->
  <rect x="940" y="260" width="240" height="320" rx="8" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1060" y="285" text-anchor="middle" font-size="12" class="group-label" style="fill:#616161">Reused Designs</text>

  <g class="box">
    <rect x="960" y="310" width="200" height="60" rx="6" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1.5"/>
    <text x="1060" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#424242">survey-wisdom-core</text>
    <text x="1060" y="360" text-anchor="middle" font-size="11" fill="#616161">scoring, evaluation gate</text>
  </g>

  <g class="box">
    <rect x="960" y="400" width="200" height="60" rx="6" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1.5"/>
    <text x="1060" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#424242">paper-survey-agent</text>
    <text x="1060" y="450" text-anchor="middle" font-size="11" fill="#616161">LangGraph pipeline pattern</text>
  </g>

  <g class="box">
    <rect x="960" y="490" width="200" height="60" rx="6" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1.5"/>
    <text x="1060" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#424242">PyPer</text>
    <text x="1060" y="540" text-anchor="middle" font-size="11" fill="#616161">plugin architecture</text>
  </g>

  <!-- Arrows -->
  <!-- User -> MCP -->
  <line x1="600" y1="90" x2="600" y2="140" class="arrow" marker-end="url(#arrowhead)"/>
  <!-- MCP -> FastAPI -->
  <line x1="600" y1="190" x2="470" y2="260" class="arrow" marker-end="url(#arrowhead)"/>
  <!-- FastAPI -> Tools -->
  <line x1="380" y1="320" x2="290" y2="360" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="470" y1="320" x2="470" y2="360" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="560" y1="320" x2="650" y2="360" class="arrow" marker-end="url(#arrowhead)"/>
  <!-- run_survey -> Pipeline -->
  <line x1="290" y1="410" x2="400" y2="460" class="arrow" marker-end="url(#arrowhead)"/>
  <!-- Pipeline -> Domains -->
  <line x1="420" y1="510" x2="230" y2="580" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="470" y1="510" x2="470" y2="580" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="520" y1="510" x2="710" y2="580" class="arrow" marker-end="url(#arrowhead)"/>
  <!-- Paper -> Sources -->
  <line x1="200" y1="650" x2="180" y2="690" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="260" y1="650" x2="320" y2="760" class="arrow" marker-end="url(#arrowhead)"/>
  <!-- Pipeline -> Outputs -->
  <line x1="550" y1="510" x2="550" y2="740" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="510" x2="720" y2="740" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="610" y1="510" x2="720" y2="810" class="arrow" marker-end="url(#arrowhead)"/>
  <!-- Influences dotted -->
  <line x1="960" y1="340" x2="640" y2="480" class="arrow-dotted" marker-end="url(#arrowhead-dotted)"/>
  <line x1="960" y1="430" x2="600" y2="470" class="arrow-dotted" marker-end="url(#arrowhead-dotted)"/>
  <line x1="960" y1="520" x2="620" y2="480" class="arrow-dotted" marker-end="url(#arrowhead-dotted)"/>

</svg>
</div>
<p style="margin-top:1rem; color:#666; font-size:0.9rem;">
  凡例: <span style="color:#2e7d32">緑 = サーバ/API</span> · <span style="color:#c62828">赤 = ドメイン</span> · <span style="color:#f9a825">黄 = 出力</span> · <span style="color:#999">点線 = 設計参考</span>
</p>
</body>
</html>
