<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>survey-mcp-skill システム構成図</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e2e8f0;
  }
  h1 {
    margin: 0.5rem 0 0.2rem;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #94a3b8;
  }
  .diagram {
    width: 96vw;
    max-width: 1100px;
    aspect-ratio: 1100 / 520;
    background: #1e293b;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    padding: 0.6rem;
  }
  svg { display: block; width: 100%; height: 100%; }
  text { font-family: inherit; user-select: none; }
  .box { cursor: default; transition: opacity 0.2s; }
  .box:hover { opacity: 0.85; }
  .group { fill: none; stroke: #334155; stroke-width: 1.5; }
  .group-title { fill: #64748b; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
  .arrow { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
  .arrow-dotted { stroke: #475569; stroke-width: 1.2; fill: none; stroke-dasharray: 3,3; }
</style>
</head>
<body>
<h1>survey-mcp-skill architecture</h1>
<div class="diagram">
<svg viewBox="0 0 1100 520" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,8 2.5,0 5" fill="#94a3b8"/></marker>

  <!-- groups -->
  <rect x=" 10" y="10" width="860" height="125" rx="6" class="group" stroke-dasharray="4,3"/>

  <rect x=" 10" y="150" width="860" height="130" rx="6" class="group" stroke-dasharray="4,3"/>

  <rect x=" 10" y="295" width="860" height="100" rx="6" class="group" stroke-dasharray="4,3"/>

  <rect x="880" y="10" width="210" height="500" rx="6" class="group" stroke-dasharray="4,3"/>
  <text x="892" y="26" class="group-title">Reuse / Design</text>

  <g class="box">
    <rect x="365" y="38" width="170" height="38" rx="6" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
    <text x="450" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#f0f9ff">User / Pi TUI</text>

  </g>

    <rect x="400" y="366" width="100" height="34" rx="5" fill="#f43f5e" stroke="#e11d48" stroke-width="1.5" opacity="0.5"/>
    <text x="450" y="387" text-anchor="middle" font-size="11" font-weight="700" fill="#fff1f2">Repo</text>
  </g>
  <g class="box">
    <rect x="600" y="366" width="100" height="34" rx="5" fill="#f43f5e" stroke="#e11d48" stroke-width="1.5" opacity="0.5"/>
    <text x="650" y="387" text-anchor="middle" font-size="11" font-weight="700" fill="#fff1f2">Marketing</text>
  </g>

  <!-- 4-Sources -->
  <g class="box">
    <rect x=" 22" y="434" width="110" height="34" rx="5" fill="#a855f7" stroke="#7c3aed" stroke-width="1.5"/>
    <text x=" 77" y="455" text-anchor="middle" font-size="10" font-weight="700" fill="#faf5ff">Semantic Scholar</text>
  </g>

    <rect x="142" y="434" width=" 90" height="34" rx="5" fill="#a855f7" stroke="#7c3aed" stroke-width="1.5" opacity="0.7"/>
    <text x="187" y="455" text-anchor="middle" font-size="10" font-weight="700" fill="#faf5ff">arXiv fallback</text>
  </g>

    <rect x="280" y="434" width=" 90" height="34" rx="5" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="325" y="455" text-anchor="middle" font-size="10" font-weight="700" fill="#422006">SQLite DB</text>

  <g class="box">
    <rect x="380" y="434" width="120" height="34" rx="5" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="440" y="455" text-anchor="middle" font-size="10" font-weight="700" fill="#422006">MD / JSON / HTML</text>
  </g>
  <g class="box">
    <rect x="510" y="434" width="110" height="34" rx="5" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="565" y="455" text-anchor="middle" font-size="10" font-weight="700" fill="#422006">llm-wiki</text>
  </g>

  <!-- Reused designs -->
  <g class="box">
    <rect x="895" y="45" width="180" height="54" rx="5" fill="#334155" stroke="#475569" stroke-width="1.5"/>

  </g>
  <g class="box">
    <rect x="895" y="185" width="180" height="54" rx="5" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <text x="985" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#e2e8f0">PyPer</text>
    <text x="985" y="225" text-anchor="middle" font-size="9" fill="#94a3b8">plugin architecture</text>
  </g>

  <!-- Arrows -->
  <line x1="450" y1="76" x2="450" y2="88" class="arrow" marker-end="url(#a)"/>
  <line x1="450" y1="126" x2="450" y2="164" class="arrow" marker-end="url(#a)"/>
  <line x1="400" y1="206" x2="310" y2="232" class="arrow" marker-end="url(#a)"/>

  <line x1="250" y1="400" x2="187" y2="434" class="arrow" marker-end="url(#a)"/>

  <line x1="650" y1="400" x2="565" y2="434" class="arrow" marker-end="url(#a)"/>
